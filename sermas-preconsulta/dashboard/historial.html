<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HCIS - Historial del paciente</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Tahoma, Verdana, sans-serif; background: #cfd8e3; color: #0b2340; }
    .topbar {
      background: linear-gradient(180deg, #2f5f95 0%, #204a78 100%);
      color: #fff;
      padding: 10px 14px;
      border-bottom: 1px solid #143255;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .topbar h1 { font-size: 16px; font-weight: 700; }
    .back-link {
      color: #0b2c4f;
      background: #dce8f5;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      padding: 7px 10px;
      border: 1px solid #6f8db2;
      border-radius: 4px;
    }
    .layout {
      max-width: 980px;
      margin: 10px auto;
      padding: 0 10px 18px;
    }
    .panel {
      background: #e8eef6;
      border: 1px solid #6c88aa;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: inset 0 1px 0 #fff;
    }
    .panel-title {
      background: linear-gradient(180deg, #3f71a8 0%, #2f5f95 100%);
      color: #fff;
      padding: 7px 10px;
      font-size: 14px;
      font-weight: 700;
      border-bottom: 1px solid #21466f;
    }
    .panel-body { padding: 10px; }
    .patient-line {
      background: #d6e3f2;
      border: 1px solid #8aa3be;
      padding: 8px 10px;
      font-size: 12px;
      border-radius: 4px;
      margin-bottom: 10px;
      line-height: 1.5;
    }
    .search-box {
      width: 100%;
      height: 36px;
      font-size: 13px;
      border: 1px solid #7f98b6;
      border-radius: 4px;
      background: #f7fbff;
      padding: 0 10px;
    }
    .search-state {
      margin-top: 10px;
      border: 1px dashed #8aa3be;
      border-radius: 4px;
      padding: 12px;
      background: #f5f9ff;
      font-size: 12px;
      color: #37506c;
    }
    .results {
      margin-top: 10px;
      display: grid;
      gap: 8px;
    }
    .result-item {
      border: 1px solid #8aa3be;
      border-radius: 4px;
      background: #edf4fc;
      padding: 9px;
      font-size: 12px;
      line-height: 1.4;
    }
    .result-head {
      margin-bottom: 5px;
      color: #244b73;
      font-weight: 700;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <h1>HP-HCIS · Historial clínico</h1>
    <a class="back-link" href="/">← Volver al dashboard</a>
  </header>

  <main class="layout">
    <section class="panel">
      <div class="panel-title">Datos básicos del paciente</div>
      <div class="panel-body">
        <div id="patientLine" class="patient-line">Cargando paciente...</div>
        <input id="query" class="search-box" type="text" placeholder="Buscar en historial semántico...">
        <div id="searchState" class="search-state">Escribe una consulta para buscar en los documentos clínicos.</div>
        <div id="results" class="results"></div>
      </div>
    </section>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const cip = params.get("cip");
    const patientLineEl = document.getElementById("patientLine");
    const queryEl = document.getElementById("query");
    const searchStateEl = document.getElementById("searchState");
    const resultsEl = document.getElementById("results");

    let debounceId = null;
    let activeController = null;

    async function loadBasicPatient() {
      if (!cip) {
        patientLineEl.textContent = "No se recibió CIP en la URL.";
        return;
      }
      try {
        const res = await fetch(`/fhir/pacientes/${encodeURIComponent(cip)}/historial`);
        if (!res.ok) {
          patientLineEl.textContent = "No se encontró historial para este paciente.";
          return;
        }
        const history = await res.json();
        const p = history.paciente || {};
        const name = p.nombre_completo || p.nombre || "Paciente";
        patientLineEl.innerHTML = `
          <b>${name}</b> · CIP <b>${p.cip || cip}</b><br>
          Fecha nacimiento: ${p.fecha_nacimiento || "s/d"} · Sexo: ${p.sexo || "s/d"}
        `;
      } catch (err) {
        patientLineEl.textContent = "Error cargando datos básicos del paciente.";
      }
    }

    async function warmupSemanticIndex() {
      if (!cip) return;
      searchStateEl.textContent = "Preparando índice semántico del paciente...";
      try {
        const res = await fetch(`/fhir/pacientes/${encodeURIComponent(cip)}/search/index`, {
          method: "POST",
        });
        if (!res.ok) {
          searchStateEl.textContent = "No se pudo preparar el índice semántico.";
          return;
        }

        const data = await res.json();
        if (data.integration_status === "no_documents") {
          const p = data.documents_path ? ` Ruta: ${data.documents_path}` : "";
          searchStateEl.textContent = (data.message || "No hay documentos para indexar.") + p;
          return;
        }

        const idx = data.indexing || {};
        if (idx.performed) {
          const p = data.documents_path ? ` Ruta: ${data.documents_path}.` : "";
          searchStateEl.textContent = `Índice listo (${idx.indexed_files || 0} ficheros, ${idx.failed_files || 0} errores).${p} Escribe una consulta.`;
        } else {
          searchStateEl.textContent = "Índice preparado. Escribe una consulta para buscar en los documentos clínicos.";
        }
      } catch (_) {
        searchStateEl.textContent = "Error preparando el índice semántico.";
      }
    }

    function clearResults() {
      resultsEl.innerHTML = "";
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function renderResults(items) {
      if (!Array.isArray(items) || items.length === 0) {
        clearResults();
        searchStateEl.textContent = "Sin resultados para esta consulta.";
        return;
      }

      searchStateEl.textContent = `Resultados: ${items.length}`;
      resultsEl.innerHTML = items.map((item, idx) => {
        const origin = escapeHtml(item.origin || "archivo no informado");
        const scoreRaw = typeof item.score === "number" ? item.score : 0;
        const score = Math.max(0, Math.min(1, scoreRaw));
        const scorePct = Math.round(score * 100);
        const text = escapeHtml(item.text || "(sin fragmento)");
        return `
          <div class="result-item">
            <div class="result-head">#${idx + 1} · Archivo: ${origin} · Score: ${scorePct}%</div>
            <div>${text}</div>
          </div>
        `;
      }).join("");
    }

    async function runSemanticSearch() {
      const q = queryEl.value.trim();
      if (!cip) return;

      if (!q) {
        clearResults();
        searchStateEl.textContent = "Escribe una consulta para buscar en los documentos clínicos.";
        return;
      }

      if (activeController) {
        activeController.abort();
      }
      activeController = new AbortController();

      searchStateEl.textContent = "Buscando... Si es la primera consulta, se está indexando la carpeta del paciente.";
      try {
        const params = new URLSearchParams({ q, mode: "semantic", limit: "12" });
        const res = await fetch(`/fhir/pacientes/${encodeURIComponent(cip)}/search?${params.toString()}`, {
          signal: activeController.signal,
        });

        if (!res.ok) {
          clearResults();
          let detail = "No se pudo ejecutar la búsqueda semántica.";
          try {
            const errBody = await res.json();
            if (errBody && errBody.detail) detail = String(errBody.detail);
          } catch (_) {}
          searchStateEl.textContent = detail;
          return;
        }

        const data = await res.json();
        const status = data.integration_status || "ok";
        const indexing = data.indexing || {};

        if (status === "error") {
          clearResults();
          searchStateEl.textContent = data.message || "Error en medical_search.";
          return;
        }

        if (status === "no_documents") {
          clearResults();
          const p = data.documents_path ? ` Ruta: ${data.documents_path}` : "";
          searchStateEl.textContent = (data.message || "No hay documentos del paciente para indexar.") + p;
          return;
        }

        const items = Array.isArray(data.items) ? data.items : [];
        renderResults(items);

        if (indexing.performed) {
          const ok = Number(indexing.indexed_files || 0);
          const ko = Number(indexing.failed_files || 0);
          const suffix = items.length ? ` Resultados: ${items.length}.` : "";
          searchStateEl.textContent = `Indexacion completada (${ok} ficheros, ${ko} errores).${suffix}`;
        } else if (data.message && items.length) {
          searchStateEl.textContent = `${data.message} Resultados: ${items.length}.`;
        }
      } catch (err) {
        if (err && err.name === "AbortError") return;
        clearResults();
        searchStateEl.textContent = "Error en la búsqueda semántica.";
      }
    }

    queryEl.addEventListener("input", () => {
      if (debounceId) clearTimeout(debounceId);
      debounceId = setTimeout(runSemanticSearch, 280);
    });

    loadBasicPatient();
    warmupSemanticIndex();
  </script>
</body>
</html>
