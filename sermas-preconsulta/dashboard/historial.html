<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HCIS - Historial del paciente</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Tahoma, Verdana, sans-serif; background: #cfd8e3; color: #0b2340; }
    .topbar {
      background: linear-gradient(180deg, #2f5f95 0%, #204a78 100%);
      color: #fff;
      padding: 10px 14px;
      border-bottom: 1px solid #143255;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .topbar h1 { font-size: 16px; font-weight: 700; }
    .back-link {
      color: #0b2c4f;
      background: #dce8f5;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      padding: 7px 10px;
      border: 1px solid #6f8db2;
      border-radius: 4px;
    }
    .layout {
      max-width: 980px;
      margin: 10px auto;
      padding: 0 10px 18px;
    }
    .panel {
      background: #e8eef6;
      border: 1px solid #6c88aa;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: inset 0 1px 0 #fff;
    }
    .panel-title {
      background: linear-gradient(180deg, #3f71a8 0%, #2f5f95 100%);
      color: #fff;
      padding: 7px 10px;
      font-size: 14px;
      font-weight: 700;
      border-bottom: 1px solid #21466f;
    }
    .panel-body { padding: 10px; }
    .history-layout {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(260px, 1fr);
      gap: 10px;
      align-items: start;
    }
    .history-left,
    .summary-column {
      min-width: 0;
    }
    .patient-line {
      background: #d6e3f2;
      border: 1px solid #8aa3be;
      padding: 8px 10px;
      font-size: 12px;
      border-radius: 4px;
      margin-bottom: 10px;
      line-height: 1.5;
    }
    .search-box {
      width: 100%;
      height: 36px;
      font-size: 13px;
      border: 1px solid #7f98b6;
      border-radius: 4px;
      background: #f7fbff;
      padding: 0 10px;
    }
    .search-state {
      margin-top: 10px;
      border: 1px dashed #8aa3be;
      border-radius: 4px;
      padding: 12px;
      background: #f5f9ff;
      font-size: 12px;
      color: #37506c;
    }
    .results {
      margin-top: 10px;
      display: grid;
      gap: 8px;
    }
    .result-item {
      border: 1px solid #8aa3be;
      border-radius: 4px;
      background: #edf4fc;
      padding: 9px;
      font-size: 12px;
      line-height: 1.4;
    }
    .result-head {
      margin-bottom: 5px;
      color: #244b73;
      font-weight: 700;
      font-size: 11px;
    }
    .summary-card {
      border: 1px solid #8aa3be;
      border-radius: 4px;
      background: #edf4fc;
      padding: 10px;
    }
    .summary-title {
      color: #244b73;
      font-weight: 700;
      font-size: 12px;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: .3px;
    }
    .summary-btn {
      display: inline-block;
      border: 1px solid #5f7ea2;
      background: linear-gradient(180deg, #3f71a8 0%, #2f5f95 100%);
      color: #fff;
      border-radius: 4px;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      text-align: center;
      margin-bottom: 8px;
    }
    .summary-btn[disabled] {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .summary-state {
      border: 1px dashed #8aa3be;
      border-radius: 4px;
      padding: 8px;
      background: #f5f9ff;
      font-size: 12px;
      color: #37506c;
      margin-bottom: 8px;
    }
    .summary-content {
      border: 1px solid #8aa3be;
      border-radius: 4px;
      background: #f7fbff;
      padding: 8px;
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      min-height: 180px;
      color: #0b2340;
    }
    @media (max-width: 860px) {
      .history-layout {
        grid-template-columns: 1fr;
      }
      .summary-content {
        min-height: 140px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <h1>HP-HCIS · Patient clinical history</h1>
    <a class="back-link" href="/">← Back to dashboard</a>
  </header>

  <main class="layout">
    <section class="panel">
      <div class="panel-title">Patient Overview</div>
      <div class="panel-body">
        <div class="history-layout">
          <div class="history-left">
            <div id="patientLine" class="patient-line">Loading patient...</div>
            <input id="query" class="search-box" type="text" placeholder="Search patient documents semantically...">
            <div id="searchState" class="search-state">Type a query to search across the patient's clinical documents.</div>
            <div id="results" class="results"></div>
          </div>
          <aside class="summary-column">
            <div class="summary-card">
              <div class="summary-title">AI Search Summary</div>
              <button id="generateSummaryBtn" class="summary-btn" type="button" disabled>Generate Summary</button>
              <div id="summaryState" class="summary-state">Run a search first, then click the button to generate a summary in English.</div>
              <div id="summaryContent" class="summary-content">No summary generated yet.</div>
            </div>
          </aside>
        </div>
      </div>
    </section>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const cip = params.get("cip");
    const patientLineEl = document.getElementById("patientLine");
    const queryEl = document.getElementById("query");
    const searchStateEl = document.getElementById("searchState");
    const resultsEl = document.getElementById("results");
    const generateSummaryBtn = document.getElementById("generateSummaryBtn");
    const summaryStateEl = document.getElementById("summaryState");
    const summaryContentEl = document.getElementById("summaryContent");

    let debounceId = null;
    let activeController = null;
    let latestQuery = "";
    let latestResults = [];

    function updateSummaryButtonState() {
      const hasSearchOutput = Boolean(latestQuery) && Array.isArray(latestResults) && latestResults.length > 0;
      generateSummaryBtn.disabled = !hasSearchOutput;
    }

    function clearSummary(message) {
      summaryStateEl.textContent = message || "Run a search first, then click the button to generate a summary in English.";
      summaryContentEl.textContent = "No summary generated yet.";
      updateSummaryButtonState();
    }

    async function loadBasicPatient() {
      if (!cip) {
        patientLineEl.textContent = "Missing CIP in URL.";
        return;
      }
      try {
        const res = await fetch(`/fhir/pacientes/${encodeURIComponent(cip)}/historial`);
        if (!res.ok) {
          patientLineEl.textContent = "No history found for this patient.";
          return;
        }
        const history = await res.json();
        const p = history.paciente || {};
        const name = p.nombre_completo || p.nombre || "Paciente";
        patientLineEl.innerHTML = `
          <b>${name}</b> · CIP <b>${p.cip || cip}</b><br>
          Birth date: ${p.fecha_nacimiento || "n/a"} · Sex: ${p.sexo || "n/a"}
        `;
      } catch (err) {
        patientLineEl.textContent = "Error loading patient basic information.";
      }
    }

    async function warmupSemanticIndex() {
      if (!cip) return;
      searchStateEl.textContent = "Preparing the patient's semantic index...";
      try {
        const res = await fetch(`/fhir/pacientes/${encodeURIComponent(cip)}/search/index`, {
          method: "POST",
        });
        if (!res.ok) {
          searchStateEl.textContent = "Could not prepare semantic index.";
          return;
        }

        const data = await res.json();
        if (data.integration_status === "no_documents") {
          const p = data.documents_path ? ` Path: ${data.documents_path}` : "";
          searchStateEl.textContent = (data.message || "No documents found to index.") + p;
          return;
        }

        const idx = data.indexing || {};
        if (idx.performed) {
          const p = data.documents_path ? ` Path: ${data.documents_path}.` : "";
          searchStateEl.textContent = `Index ready (${idx.indexed_files || 0} files, ${idx.failed_files || 0} errors).${p} Type a query.`;
        } else {
          searchStateEl.textContent = "Index ready. Type a query to search the patient's clinical documents.";
        }
      } catch (_) {
        searchStateEl.textContent = "Error preparing semantic index.";
      }
    }

    function clearResults() {
      resultsEl.innerHTML = "";
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function renderResults(items) {
      if (!Array.isArray(items) || items.length === 0) {
        clearResults();
        searchStateEl.textContent = "No results for this query.";
        return;
      }

      searchStateEl.textContent = `Results: ${items.length}`;
      resultsEl.innerHTML = items.map((item, idx) => {
        const origin = escapeHtml(item.origin || "source not provided");
        const scoreRaw = typeof item.score === "number" ? item.score : 0;
        const score = Math.max(0, Math.min(1, scoreRaw));
        const scorePct = Math.round(score * 100);
        const text = escapeHtml(item.text || "(no snippet)");
        return `
          <div class="result-item">
            <div class="result-head">#${idx + 1} · Source file: ${origin} · Score: ${scorePct}%</div>
            <div>${text}</div>
          </div>
        `;
      }).join("");
    }

    async function runSemanticSearch() {
      const q = queryEl.value.trim();
      if (!cip) return;

      if (!q) {
        clearResults();
        latestQuery = "";
        latestResults = [];
        searchStateEl.textContent = "Type a query to search across clinical documents.";
        clearSummary();
        return;
      }

      if (activeController) {
        activeController.abort();
      }
      activeController = new AbortController();

      searchStateEl.textContent = "Searching... If this is the first query, patient documents are being indexed.";
      try {
        const params = new URLSearchParams({ q, mode: "semantic", limit: "12" });
        const res = await fetch(`/fhir/pacientes/${encodeURIComponent(cip)}/search?${params.toString()}`, {
          signal: activeController.signal,
        });

        if (!res.ok) {
          clearResults();
          let detail = "No se pudo ejecutar la búsqueda semántica.";
          try {
            const errBody = await res.json();
            if (errBody && errBody.detail) detail = String(errBody.detail);
          } catch (_) {}
          searchStateEl.textContent = detail;
          latestQuery = q;
          latestResults = [];
          clearSummary("No results available to summarize.");
          return;
        }

        const data = await res.json();
        const status = data.integration_status || "ok";
        const indexing = data.indexing || {};

        if (status === "error") {
          clearResults();
          searchStateEl.textContent = data.message || "Error en medical_search.";
          latestQuery = q;
          latestResults = [];
          clearSummary("No results available to summarize.");
          return;
        }

        if (status === "no_documents") {
          clearResults();
          const p = data.documents_path ? ` Path: ${data.documents_path}` : "";
          searchStateEl.textContent = (data.message || "No patient documents available for indexing.") + p;
          latestQuery = q;
          latestResults = [];
          clearSummary("No results available to summarize.");
          return;
        }

        const items = Array.isArray(data.items) ? data.items : [];
        latestQuery = q;
        latestResults = items;
        updateSummaryButtonState();
        if (items.length > 0) {
          summaryStateEl.textContent = "Results are ready. Click Generate Summary to ask the model.";
        } else {
          clearSummary("No results available to summarize.");
        }
        renderResults(items);

        if (indexing.performed) {
          const ok = Number(indexing.indexed_files || 0);
          const ko = Number(indexing.failed_files || 0);
          const suffix = items.length ? ` Results: ${items.length}.` : "";
          searchStateEl.textContent = `Indexing completed (${ok} files, ${ko} errors).${suffix}`;
        } else if (data.message && items.length) {
          searchStateEl.textContent = `${data.message} Results: ${items.length}.`;
        }
      } catch (err) {
        if (err && err.name === "AbortError") return;
        clearResults();
        latestQuery = q;
        latestResults = [];
        searchStateEl.textContent = "Semantic search failed.";
        clearSummary("No results available to summarize.");
      }
    }

    async function generateSummary() {
      if (!cip) return;
      if (!latestQuery || !Array.isArray(latestResults) || latestResults.length === 0) {
        clearSummary("Run a search with visible results before generating a summary.");
        return;
      }

      generateSummaryBtn.disabled = true;
      summaryStateEl.textContent = "Generating summary with Ollama model llama3.2:1b...";
      try {
        const res = await fetch(`/fhir/pacientes/${encodeURIComponent(cip)}/search/summary`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: latestQuery, results: latestResults }),
        });

        if (!res.ok) {
          let detail = "Summary generation failed.";
          try {
            const errBody = await res.json();
            if (errBody && errBody.detail) detail = String(errBody.detail);
          } catch (_) {}
          summaryStateEl.textContent = "Could not generate summary.";
          summaryContentEl.textContent = detail;
          return;
        }

        const data = await res.json();
        summaryStateEl.textContent = `Summary generated with ${data.model || "llama3.2:1b"}.`;
        summaryContentEl.textContent = data.summary || "No summary returned.";
      } catch (_) {
        summaryStateEl.textContent = "Could not generate summary.";
        summaryContentEl.textContent = "Unexpected error while requesting summary.";
      } finally {
        updateSummaryButtonState();
      }
    }

    queryEl.addEventListener("input", () => {
      if (debounceId) clearTimeout(debounceId);
      debounceId = setTimeout(runSemanticSearch, 280);
    });
    generateSummaryBtn.addEventListener("click", generateSummary);

    loadBasicPatient();
    warmupSemanticIndex();
    clearSummary();
  </script>
</body>
</html>
