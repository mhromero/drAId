[project]
name = "draid"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.0.8",
    "en-core-sci-md",
    "negspacy>=1.0.4",
    "pillow>=11.2.1",
    "pymupdf>=1.26.0",
    "pytesseract>=0.3.13",
    "scispacy>=0.6.2",
    "spacy>=3.7.4,<3.8.0",
]

[tool.uv.sources]
en-core-sci-md = { url = "https://s3-us-west-2.amazonaws.com/ai2-s2-scispacy/releases/v0.5.4/en_core_sci_md-0.5.4.tar.gz" }

[project.scripts]
medical-search = "medical_search.cli:run_cli"
mtsamples-export = "medical_search.mtsamples_export:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["medical_search"]

[tool.hatch.build.targets.sdist]
include = [
  "medical_search",
  "README.md",
  "pyproject.toml",
  "main.py",
]
